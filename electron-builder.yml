appId: com.kubedeck.app
productName: KubeDeck

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - node_modules/**/*
  - package.json

asar: true
asarUnpack:
  - dist/**/*
# No required native addons. Skip node-gyp so Windows CI does not need Visual Studio
# (optional bufferutil is a ws speedup only; the JS fallback is used instead).
npmRebuild: false
afterPack: build/afterPack.cjs

mac:
  identity: null
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  icon: build/icon.icns

win:
  target:
    - nsis
    - portable
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

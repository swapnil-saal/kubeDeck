# KubeDeck web mode behind oauth2-proxy (Keycloak). Replace every CHANGE_ME / example value.
# Step-by-step: docs/DEPLOYMENT.md
#
# The pod runs two containers. oauth2-proxy is the only thing reachable from outside: it signs
# users in with Keycloak and forwards requests with their identity headers. KubeDeck listens on
# 127.0.0.1 only, so nothing but the sidecar in the same pod can reach it — that is what makes
# KUBEDECK_TRUST_PROXY_NETWORK=1 safe. docs/WEB.md explains each setting.
apiVersion: v1
kind: Namespace
metadata:
  name: kubedeck
---
# Cluster identity KubeDeck uses. Every signed-in user acts through it, so its RBAC is the real limit:
# kubedeck-reader lets users look; kubedeck-operator (below) lets them change things and browse pod files.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubedeck
  namespace: kubedeck
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubedeck-reader
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, events, namespaces, nodes, persistentvolumeclaims, configmaps, resourcequotas, limitranges]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
  # Secrets are deliberately NOT listed. Add them only if every KubeDeck user may read every secret.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubedeck-reader
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kubedeck-reader }
subjects:
  - { kind: ServiceAccount, name: kubedeck, namespace: kubedeck }
---
# Writes from the UI and the assistant (scale, restart, edit, delete), and pod files (fixed read-only
# scripts run with kubectl exec). For a look-only KubeDeck, delete this role and its binding and set
# KUBEDECK_READ_ONLY=true; to drop pod files only, remove pods/exec and set KUBEDECK_POD_FILES=off.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubedeck-operator
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps, persistentvolumeclaims]
    verbs: [patch, update, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets, deployments/scale, statefulsets/scale]
    verbs: [patch, update, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [patch, update, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [patch, update, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubedeck-operator
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kubedeck-operator }
subjects:
  - { kind: ServiceAccount, name: kubedeck, namespace: kubedeck }
---
# Per-user permissions (optional, KUBEDECK_ACCESS=impersonate below): KubeDeck acts as each signed-in
# user (kubectl --as), so their own RBAC applies and the two roles above stop mattering for users.
# Bind roles to your Keycloak users / groups first, then give KubeDeck only this:
# ---
# apiVersion: rbac.authorization.k8s.io/v1
# kind: ClusterRole
# metadata: { name: kubedeck-impersonator }
# rules:
#   - apiGroups: [""]
#     resources: [users, groups]
#     verbs: [impersonate]
# ---
# apiVersion: rbac.authorization.k8s.io/v1
# kind: ClusterRoleBinding
# metadata: { name: kubedeck-impersonator }
# roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kubedeck-impersonator }
# subjects:
#   - { kind: ServiceAccount, name: kubedeck, namespace: kubedeck }
---
# The Keycloak client credentials live in a Secret named "kubedeck-oauth" that you create with kubectl
# (docs/DEPLOYMENT.md, step 3) so no secret value is ever written into this file. The AI provider for the
# assistant comes from an optional Secret "kubedeck-ai" (docs/DEPLOYMENT.md, step 3); without it the assistant shows as offline.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubedeck
  namespace: kubedeck
spec:
  replicas: 1
  selector:
    matchLabels: { app: kubedeck }
  template:
    metadata:
      labels: { app: kubedeck }
    spec:
      serviceAccountName: kubedeck
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: kubedeck
          image: swapnilsaal/kubedeck:1.14.0-web   # or your own registry: see docs/DEPLOYMENT.md
          env:
            - { name: KUBEDECK_MODE, value: web }
            - { name: HOST, value: 127.0.0.1 }            # only the sidecar can reach it
            - { name: KUBEDECK_TRUST_PROXY_NETWORK, value: "1" }
            - { name: KUBEDECK_PUBLIC_URL, value: "https://kubedeck.example.com" }
            # Every feature is on. Turn one off here: KUBEDECK_READ_ONLY=true, KUBEDECK_AI=off, KUBEDECK_POD_FILES=off
            # - { name: KUBEDECK_ALLOWED_GROUPS, value: "platform,sre" }   # restrict by Keycloak group
            # Per-user permissions: act as each signed-in user (see kubedeck-impersonator above)
            # - { name: KUBEDECK_ACCESS, value: impersonate }
            # - { name: KUBEDECK_IMPERSONATE_USER, value: email }       # or "name" (preferred username)
            # - { name: KUBEDECK_IMPERSONATE_PREFIX, value: "oidc:" }   # match the API server's --oidc-username-prefix
            # - { name: KUBEDECK_IMPERSONATE_GROUP_PREFIX, value: "oidc:" }
            - name: KUBEDECK_AI_PROVIDER                  # openai | anthropic | ollama | custom
              valueFrom: { secretKeyRef: { name: kubedeck-ai, key: provider, optional: true } }
            - name: KUBEDECK_AI_API_KEY
              valueFrom: { secretKeyRef: { name: kubedeck-ai, key: api-key, optional: true } }
            - name: KUBEDECK_AI_MODEL
              valueFrom: { secretKeyRef: { name: kubedeck-ai, key: model, optional: true } }
            - name: KUBEDECK_AI_FAST_MODEL
              valueFrom: { secretKeyRef: { name: kubedeck-ai, key: fast-model, optional: true } }
            - name: KUBEDECK_AI_BASE_URL
              valueFrom: { secretKeyRef: { name: kubedeck-ai, key: base-url, optional: true } }
          readinessProbe:
            exec: { command: ["wget", "-qO-", "http://127.0.0.1:5000/healthz"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["wget", "-qO-", "http://127.0.0.1:5000/healthz"] }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            - --provider=keycloak-oidc
            - --oidc-issuer-url=https://keycloak.example.com/realms/CHANGE_ME   # older Keycloak: …/auth/realms/<realm>
            - --redirect-url=https://kubedeck.example.com/oauth2/callback
            - --upstream=http://127.0.0.1:5000
            - --http-address=0.0.0.0:4180
            - --email-domain=*                 # narrow this (or use --allowed-group) for production
            - --scope=openid email profile
            - --oidc-groups-claim=groups
            - --pass-user-headers=true
            - --prefer-email-to-user=false
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --reverse-proxy=true
            - --skip-provider-button=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom: { secretKeyRef: { name: kubedeck-oauth, key: client-id } }
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: kubedeck-oauth, key: client-secret } }
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: { secretKeyRef: { name: kubedeck-oauth, key: cookie-secret } }
          ports:
            - { name: http, containerPort: 4180 }
          readinessProbe:
            httpGet: { path: /ping, port: 4180 }
          livenessProbe:
            httpGet: { path: /ping, port: 4180 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: kubedeck
  namespace: kubedeck
spec:
  selector: { app: kubedeck }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubedeck
  namespace: kubedeck
  annotations:
    # live log streaming needs long-lived responses
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [kubedeck.example.com]
      secretName: CHANGE_ME-tls
  rules:
    - host: kubedeck.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: kubedeck, port: { name: http } } } }

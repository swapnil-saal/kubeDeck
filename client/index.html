<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>kubedeck.</title>
    <script>
      // Apply the saved colour palette before the first paint (see client/src/lib/themes.ts).
      (function () {
        try {
          var mode = localStorage.getItem("kubedeck-theme") || "dark";
          if (mode === "system") mode = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          // defaults must match DEFAULT_PALETTE in lib/themes.ts
          var palette = localStorage.getItem("kubedeck-palette-" + mode) || (mode === "light" ? "paper" : "oled");
          document.documentElement.setAttribute("data-palette", palette);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
